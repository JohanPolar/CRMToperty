<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Error')}"></head>
<body>
<header class="topbar">
    <div class="topbar__inner">
        <a class="brand" th:href="@{/ui/aplicaciones}">
            <span class="brand__logo" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
            </span>
            <span><span class="brand__name">CRMToperty</span><br><span class="brand__sub">Aplicaciones de vivienda</span></span>
        </a>
    </div>
</header>
<main class="page">
    <section class="card empty">
        <div class="empty__icon" th:text="${status}">404</div>
        <strong th:text="${status == 404} ? 'No encontramos lo que buscas' : 'Algo salió mal'">Algo salió mal</strong>
        <span th:text="${status == 404} ? 'Puede que la aplicación no exista o que el enlace esté mal.' : 'El error quedó registrado en el log. Intenta de nuevo en un momento.'">detalle</span>
        <p><a class="button" th:href="@{/ui/aplicaciones}">Volver a las aplicaciones</a></p>
    </section>
</main>
</body>
</html>
