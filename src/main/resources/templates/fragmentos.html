<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabeza(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · CRMToperty'">CRMToperty</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 15.5 16 10l7 5.5V23h-4.5v-4.5h-5V23H9z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- Barra superior: marca y estado de la última corrida del proceso automático -->
<header th:fragment="barra" class="topbar">
    <div class="topbar__inner">
        <a class="brand" th:href="@{/ui/aplicaciones}">
            <span class="brand__logo" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>
            </span>
            <span>
                <span class="brand__name">CRMToperty</span><br>
                <span class="brand__sub">Aplicaciones de vivienda</span>
            </span>
        </a>

        <span th:if="${corrida == null}" class="run run--none">
            <span class="run__dot"></span><span class="run__text">El proceso aún no ha corrido</span>
        </span>
        <span th:if="${corrida != null}" class="run" th:classappend="${corrida.error != null} ? 'run--error'"
              th:title="|Corrida #${corrida.id}: ${corrida.leidas} leídas, ${corrida.nuevas} nuevas, ${corrida.evaluadas} evaluadas, ${corrida.notificadas} notificadas|">
            <span class="run__dot"></span>
            <span class="run__text" th:text="${corrida.error != null} ? 'La última corrida falló ·' : 'Proceso automático activo ·'">Proceso automático activo ·</span>
            <span class="muted" th:text="${@fmt.hace(corrida.iniciadaEn)}">hace 1 min</span>
        </span>
    </div>
</header>

</body>
</html>
