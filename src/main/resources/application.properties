spring.application.name=CRMToperty

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crm_toperty}
spring.datasource.username=${DB_USER:crm_user}
spring.datasource.password=${DB_PASSWORD:root3003}

# El esquema lo define Flyway (db/migration); Hibernate solo verifica que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Archivos externos al jar: se pueden cambiar sin recompilar
app.programas.path=${PROGRAMAS_PATH:data/programas.json}
app.inbox.path=${INBOX_PATH:data}
