services:
  postgres:
    image: postgres:18
    container_name: crm-toperty-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm_toperty
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: root3003
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data: